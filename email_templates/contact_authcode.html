<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
</head>

<body width="100%" style="margin: 0; background-color: #F0F2F3;">
    <div class="email-container" style="margin: auto; max-width: 600px; padding-top: 50px;">
        <table cellspacing="0" cellpadding="0" width="100%"
            style="border: 0px; border-bottom: 1px solid #D6D6D6; max-width: 600px;">
            <tr>
                <td
                    style="background-color: #FFF; color: #444; font-size: 14px; line-height: 140%; padding: 25px 35px;">
                    <h1 style="font-size: 20px; font-weight: bold; line-height: 1.3; margin: 0 0 15px 0;">
                        本人確認
                    </h1>
                    <p style="margin: 0; padding: 0;">
                        {{ message }}
                    </p>
                </td>
            </tr>
            <tr>
                <td
                    style="background-color: #FFF; color: #444; font-size: 14px; line-height: 140%; padding: 25px 35px; text-align: center;">
                    <div class="label" style="font-weight: bold; padding-bottom: 15px;">
                        認証コード
                    </div>
                    <div class="code" style="color: #000; font-size: 36px; font-weight: bold; padding-bottom: 15px;">
                        {{ code }}
                    </div>
                    <div class="description" style="color: #444; font-size: 10px;">
                        このコードは送信後 {{ expire_miniutes }} 分間有効です。
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>

</html>
